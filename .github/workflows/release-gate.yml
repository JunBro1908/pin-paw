name: Release Gate

on:
  pull_request:
  push:
    branches:
      - main
      - feature/all

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-anon-key"
      SUPABASE_SERVICE_ROLE_KEY: "ci-service-role-key"
      NEXT_PUBLIC_NAVER_CLIENT_ID: "ci-naver-search-client-id"
      NAVER_CLIENT_SECRET: "ci-naver-search-secret"
      NEXT_PUBLIC_NAVER_MAP_CLIENT_ID: "ci-naver-map-client-id"
      APP_ORIGIN: "https://pinpaw-ci.example"
      CRON_SECRET: "ci-cron-secret"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install locked dependencies
        run: npm ci

      - name: Unit and contract tests
        run: npm test

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Webpack production build
        run: npm run build

      - name: Generate dependency SBOM
        run: npm sbom --sbom-format=cyclonedx > pinpaw-sbom.cyclonedx.json

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: pinpaw-release-evidence-${{ github.sha }}
          path: pinpaw-sbom.cyclonedx.json
          if-no-files-found: error
          retention-days: 14

      - name: HTTP boundary integration
        run: npm run test:integration

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=low

  database-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install locked dependencies
        run: npm ci

      - name: Start isolated Supabase
        run: npm run db:start

      - name: Replay migrations from empty database
        run: npm run db:reset

      - name: Verify database permission matrix
        env:
          PGPASSWORD: postgres
        run: >-
          psql
          postgresql://postgres@127.0.0.1:54322/postgres
          -f tests/integration/db-permission-matrix.sql

      - name: Verify database concurrency boundaries
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npm run test:db-concurrency

      - name: Stop isolated Supabase
        if: always()
        run: npm run db:stop
